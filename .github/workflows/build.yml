name: build-apk
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем SDL2 (ветка SDL2, официальный репозиторий)
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: SDL2
          path: SDL

      - name: Скачиваем твою игру
        uses: actions/checkout@v4
        with:
          path: game

      - name: Кладём игру в проект SDL и правим Android.mk
        run: |
          cp game/zombie_siege_3d.cpp SDL/android-project/app/jni/src/zombie_siege_3d.cpp
          sed -i 's/LOCAL_SRC_FILES := YourSourceHere.c/LOCAL_SRC_FILES := zombie_siege_3d.cpp/' SDL/android-project/app/jni/src/Android.mk

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: android-actions/setup-android@v3

      - name: Ставим NDK
        run: yes | sdkmanager --install "ndk;25.2.9519653" --sdk_root=$ANDROID_SDK_ROOT

      - name: Собираем APK
        working-directory: SDL/android-project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: SDL/android-project/app/build/outputs/apk/debug/*.apk
